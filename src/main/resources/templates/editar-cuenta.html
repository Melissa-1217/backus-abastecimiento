<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | Backus Bodegas</title>
<link rel="stylesheet" th:href="@{/css/catalogo.css}"><link rel="stylesheet" th:href="@{/css/navegacion.css}"><link rel="stylesheet" th:href="@{/css/acciones.css}"><link rel="stylesheet" th:href="@{/css/franja-superior.css}"><link rel="stylesheet" th:href="@{/css/cuenta.css}"><script th:src="@{/js/guardados.js}" defer></script><script th:src="@{/js/cuenta.js}" defer></script></head><body><header class="store-header account-store-header"><div th:replace="~{fragments/franja-superior :: franja}"></div><div class="shell brand-row"><a class="brand" th:href="@{/}">BACKUS <small>B2B MAYORISTA</small></a><form class="header-search" th:action="@{/catalogo}" method="get"><label class="sr-only" for="buscar-perfil">Buscar productos</label><input id="buscar-perfil" name="busqueda" type="search" placeholder="¿Qué necesitas para tu bodega?"><button class="primary-button" type="submit">Buscar</button></form><div th:replace="~{fragments/acciones :: acciones}"></div></div><div class="shell"><nav th:replace="~{fragments/navegacion :: menu('cuenta')}"></nav></div></header><main class="account-main shell"><p class="account-breadcrumb"><a th:href="@{/cuenta}">Mi cuenta</a> / Editar datos</p><h1>Editar mis datos</h1><p class="account-intro">Completa la información de contacto y de tu bodega.</p><form class="profile-form" th:action="@{/cuenta/editar}" th:object="${perfil}" method="post"><div class="account-grid"><section class="account-panel" id="personales"><h2>Datos personales</h2><label for="nombre">Nombre completo</label><input id="nombre" th:field="*{nombre}" maxlength="100" required><p class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p><label for="telefono">Teléfono de contacto</label><input id="telefono" th:field="*{telefono}" maxlength="20" type="tel"><p class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p></section><section class="account-panel" id="negocio"><h2>Datos de mi bodega</h2><label for="bodega">Nombre de la bodega</label><input id="bodega" th:field="*{bodega}" maxlength="120" required><p class="field-error" th:if="${#fields.hasErrors('bodega')}" th:errors="*{bodega}"></p><label for="ruc">RUC (opcional)</label><input id="ruc" th:field="*{ruc}" maxlength="11" inputmode="numeric" pattern="[0-9]{11}"><p class="field-error" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></p><label for="direccion">Dirección</label><input id="direccion" th:field="*{direccion}" maxlength="200"><p class="field-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p><label for="distrito">Distrito</label><input id="distrito" th:field="*{distrito}" maxlength="100"><p class="field-error" th:if="${#fields.hasErrors('distrito')}" th:errors="*{distrito}"></p><label for="provincia">Provincia</label><input id="provincia" th:field="*{provincia}" maxlength="100"><p class="field-error" th:if="${#fields.hasErrors('provincia')}" th:errors="*{provincia}"></p><label for="departamento">Departamento</label><input id="departamento" th:field="*{departamento}" maxlength="100"><p class="field-error" th:if="${#fields.hasErrors('departamento')}" th:errors="*{departamento}"></p><label for="referencia">Referencia de entrega</label><input id="referencia" th:field="*{referencia}" maxlength="200"><p class="field-error" th:if="${#fields.hasErrors('referencia')}" th:errors="*{referencia}"></p></section></div><div class="edit-actions"><a th:href="@{/cuenta}">Cancelar</a><button class="primary-button" type="submit">Guardar cambios</button></div></form></main><footer class="account-footer"><div class="shell"><strong>BACKUS BODEGAS</strong><p>Prototipo académico sobre Backus · No es un canal oficial de la empresa.</p></div></footer></body></html>
