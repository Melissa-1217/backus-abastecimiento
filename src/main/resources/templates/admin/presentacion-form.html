<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos y presentaciones | Backus</title><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/admin-productos.css}"><script th:src="@{/js/admin-productos.js}" defer></script></head><body><div th:replace="~{admin/layout :: layout(~{::section#productos})}"><section id="productos"><div class="page-heading admin-panel"><h1 th:text="${presentacionId == null ? 'Agregar presentación' : 'Editar presentación'}"></h1><p th:text="|Producto: ${producto.nombre}|"></p></div><form class="admin-panel admin-form" method="post" enctype="multipart/form-data" th:action="${presentacionId == null} ? @{/admin/productos/{id}/presentaciones/nueva(id=${producto.id})} : @{/admin/productos/{id}/presentaciones/{prId}/editar(id=${producto.id},prId=${presentacionId})}" th:object="${form}"><label for="descripcion">Descripción de la presentación</label><input id="descripcion" type="text" th:field="*{descripcion}" maxlength="120" required placeholder="Botella 650 ml - caja de 12"><p class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p><div class="form-columns"><div><label for="contenidoMl">Contenido por unidad (ml)</label><input id="contenidoMl" type="number" th:field="*{contenidoMl}" min="1" max="2147483647" required><p class="field-error" th:if="${#fields.hasErrors('contenidoMl')}" th:errors="*{contenidoMl}"></p></div><div><label for="unidadesPorPaquete">Unidades por empaque</label><input id="unidadesPorPaquete" type="number" th:field="*{unidadesPorPaquete}" min="1" max="2147483647" required><p class="field-error" th:if="${#fields.hasErrors('unidadesPorPaquete')}" th:errors="*{unidadesPorPaquete}"></p></div></div><label for="precio">Precio por caja o paquete (S/) · IGV incluido en el prototipo</label><input id="precio" type="number" th:field="*{precio}" min="0" max="99999999.99" step="0.01" required><p class="field-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></p><input type="hidden" th:field="*{imagenUrl}"><p class="field-error gallery-error" th:if="${#fields.hasErrors('imagenUrl')}" th:errors="*{imagenUrl}"></p><label class="admin-check"><input type="checkbox" th:field="*{activo}"> Presentación activa</label><p class="form-hint" th:if="${presentacionId == null}">Se registrará en Arequipa con stock 0. Las existencias se actualizarán en Inventario.</p><section class="gallery-admin gallery-unified"><div class="gallery-heading"><div><h2>Imágenes</h2><p class="form-hint">Agrega las fotos que necesites desde tu computadora o con un enlace.</p></div></div><div class="gallery-cards" data-gallery-cards><article class="saved-photo-card" th:each="foto : ${fotos}" th:if="${fotos != null}"><div class="gallery-photo-frame"><img th:src="${foto.url}" alt="Foto guardada" loading="lazy"></div><label class="primary-photo-choice"><input type="radio" name="fotoPrincipal" th:value="${foto.url}" th:checked="${foto.url == form.imagenUrl}"><span>Principal</span></label><label class="remove-photo-choice"><input type="checkbox" name="quitarFotos" th:value="${foto.id}"><span>Quitar foto</span></label></article><button class="add-photo-tile" type="button" data-add-photo><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><strong>Agregar imagen</strong><small>Archivo o enlace</small></button></div><textarea name="fotosEnlaces" data-gallery-links hidden></textarea><p class="form-hint">PNG o JPG de hasta 5 MB por archivo. Después de guardar puedes cambiar la foto principal.</p></section><div class="form-actions"><a class="admin-secondary" th:href="@{/admin/productos}">Cancelar</a><button class="admin-primary" type="submit">Guardar presentación</button></div></form></section></div></body></html>
