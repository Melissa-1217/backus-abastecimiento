<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos y presentaciones | Backus</title><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/admin-productos.css}"><script th:src="@{/js/admin-productos.js}" defer></script></head><body><div th:replace="~{admin/layout :: layout(~{::section#productos})}"><section id="productos"><div class="page-heading admin-panel"><h1 th:text="${productoId == null ? 'Agregar producto' : 'Editar producto'}"></h1><p>Registra los datos generales. Sus formatos se agregan en presentaciones.</p></div><form class="admin-panel admin-form" method="post" enctype="multipart/form-data" th:action="${productoId == null} ? @{/admin/productos/nuevo} : @{/admin/productos/{id}/editar(id=${productoId})}" th:object="${form}"><label for="nombre">Nombre del producto</label><input id="nombre" type="text" th:field="*{nombre}" maxlength="100" required><p class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p><label for="marca">Marca</label><input id="marca" type="text" th:field="*{marca}" maxlength="80" required><p class="field-error" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></p><fieldset class="category-fieldset"><legend>Categoría</legend><div class="category-options"><label class="category-choice"><input type="radio" th:field="*{categoria}" value="Cerveza" required><span>Nacionales</span></label><label class="category-choice"><input type="radio" th:field="*{categoria}" value="Globales" required><span>Globales</span></label><label class="category-choice"><input type="radio" th:field="*{categoria}" value="Ready to Drink" required><span>Ready to Drink</span></label><label class="category-choice"><input type="radio" th:field="*{categoria}" value="No alcohólicas" required><span>No alcohólicas</span></label></div><p class="field-error category-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></p></fieldset><input type="hidden" th:field="*{imagenUrl}"><p class="field-error gallery-error" th:if="${#fields.hasErrors('imagenUrl')}" th:errors="*{imagenUrl}"></p><label class="admin-check"><input type="checkbox" th:field="*{activo}"> Producto activo en el catálogo</label><section class="gallery-admin gallery-unified"><div class="gallery-heading"><div><h2>Imágenes</h2><p class="form-hint">Agrega las fotos que necesites desde tu computadora o con un enlace.</p></div></div><div class="gallery-cards" data-gallery-cards><article class="saved-photo-card" th:each="foto : ${fotos}" th:if="${fotos != null}"><div class="gallery-photo-frame"><img th:src="${foto.url}" alt="Foto guardada" loading="lazy"></div><label class="primary-photo-choice"><input type="radio" name="fotoPrincipal" th:value="${foto.url}" th:checked="${foto.url == form.imagenUrl}"><span>Principal</span></label><label class="remove-photo-choice"><input type="checkbox" name="quitarFotos" th:value="${foto.id}"><span>Quitar foto</span></label></article><button class="add-photo-tile" type="button" data-add-photo><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><strong>Agregar imagen</strong><small>Archivo o enlace</small></button></div><textarea name="fotosEnlaces" data-gallery-links hidden></textarea><p class="form-hint">PNG o JPG de hasta 5 MB por archivo. Después de guardar puedes cambiar la foto principal.</p></section><div class="form-actions"><a class="admin-secondary" th:href="@{/admin/productos}">Cancelar</a><button class="admin-primary" type="submit">Guardar producto</button></div></form></section></div></body></html>
