<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi carrito | Backus Bodegas</title><link rel="stylesheet" th:href="@{/css/catalogo.css}"><link rel="stylesheet" th:href="@{/css/navegacion.css}"><link rel="stylesheet" th:href="@{/css/acciones.css}"><link rel="stylesheet" th:href="@{/css/carrito.css}"><script th:src="@{/js/guardados.js}" defer></script></head><body class="catalogo-page"><header class="store-header">
<div class="topbar"><div class="shell">Zona de atención: <strong th:text="${zona}">Arequipa</strong><span>Prototipo académico B2B</span></div></div>
<div class="shell brand-row"><a class="brand" th:href="@{/}">BACKUS <small>B2B MAYORISTA</small></a><form class="header-search" th:action="@{/catalogo}" method="get"><label class="sr-only" for="busqueda">Buscar productos</label><input id="busqueda" name="busqueda" type="search" th:value="${busqueda}" placeholder="¿Qué necesitas para tu bodega?"><button class="primary-button" type="submit">Buscar</button></form><div th:replace="~{fragments/acciones :: acciones}"></div></div>
<div class="shell"><nav th:replace="~{fragments/navegacion :: menu('carrito')}"></nav></div>
</header><main class="shell cart-main"><section class="confirmation"><div class="confirmation-check">✓</div><h1>Pedido de prueba confirmado</h1><p th:text="|Número de pedido: ${pedido.id}|"></p><p>Se registró el pedido y se actualizó el inventario de demostración.</p><div class="confirmed-line" th:each="detalle : ${detalles}"><span th:text="|${detalle.inventario.presentacion.producto.nombre} — ${detalle.inventario.presentacion.descripcion}|"></span><strong th:text="|${detalle.cantidad} × S/ ${#numbers.formatDecimal(detalle.precioUnitario,1,2)}|"></strong></div><h2 th:text="|Total: S/ ${#numbers.formatDecimal(pedido.total,1,2)}|"></h2><p>No se ha realizado un pago ni programado una entrega real.</p><a class="primary-button" th:href="@{/catalogo}">Volver al catálogo</a></section></main></body></html>
