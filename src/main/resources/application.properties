spring.application.name=backus-abastecimiento

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backus_abastecimiento}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Inicializa solo la nueva tabla de cuentas; no vuelve a cargar productos.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/04_usuarios.sql
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Imágenes cargadas desde la administración.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=60MB
backus.imagenes.directorio=${BACKUS_IMAGENES_DIR:uploads/productos}
